name: Auto Update
on:
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          token: ${{ secrets.GH_PAT }}
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      
      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      
      - name: Update All Modpacks
        run: |
          # Define arrays
          declare -a vpacks=("re-console" "re-console-lite")
          declare -a pfvs=("curseforge" "modrinth")
          declare -a mlvs=("fabric")
          declare -a mcvs=("1.20.1" "1.20.4" "1.21.1" "1.21.3" "1.21.4" "1.21.5" "1.21.8")
          
          # Function to update a single modpack with detailed logging
          update_modpack() {
              local modpack=$1 platform=$2 loader=$3 version=$4
              local dir="./versions/vanilla/src/$modpack/$platform/$loader/$version"
              local log_file="/tmp/packwiz_${modpack}_${platform}_${loader}_${version}.log"
              
              echo "Starting update: $modpack $platform $loader $version"
              {
                  echo "=== Starting packwiz refresh for $modpack $platform $loader $version ==="
                  cd "$dir"
                  
                  echo "--- packwiz refresh output ---"
                  packwiz refresh -y 2>&1
                  refresh_exit=$?
                  echo "--- packwiz refresh exit code: $refresh_exit ---"
                  
                  echo "--- packwiz update output ---"
                  packwiz update -a -y 2>&1
                  update_exit=$?
                  echo "--- packwiz update exit code: $update_exit ---"
                  
                  echo "=== Completed for $modpack $platform $loader $version ==="
              } > "$log_file" 2>&1 &
              
              # Store the background job PID and log file
              echo "$! $log_file" >> /tmp/packwiz_jobs.txt
          }
          
          # Initialize job tracking
          > /tmp/packwiz_jobs.txt
          started_updates=0
          
          for modpack in "${vpacks[@]}"; do
              for platform in "${pfvs[@]}"; do
                  for loader in "${mlvs[@]}"; do
                      for version in "${mcvs[@]}"; do
                          # Check if directory exists first
                          dir="./versions/vanilla/src/$modpack/$platform/$loader/$version"
                          if [ -d "$dir" ]; then
                              # Directory exists, start the update and count it
                              update_modpack "$modpack" "$platform" "$loader" "$version"
                              ((started_updates++))
                              
                              # Wait every 4 started updates for rate limiting
                              if [ $((started_updates % 4)) -eq 0 ]; then
                                  echo ""
                                  echo "=== Completed $started_updates updates, waiting for batch to finish ==="
                                  echo ""
                                  echo "=== Completed $started_updates updates, waiting for batch to finish ==="
                                  
                                  # Wait for all background jobs to complete and show their output
                                  while read -r job_info; do
                                      if [ -n "$job_info" ]; then
                                          pid=$(echo "$job_info" | cut -d' ' -f1)
                                          log_file=$(echo "$job_info" | cut -d' ' -f2)
                                          
                                          # Wait for this specific job
                                          wait "$pid" 2>/dev/null || true
                                          
                                          # Display the log output
                                          if [ -f "$log_file" ]; then
                                              echo ""
                                              echo "Output from job $pid:"
                                              cat "$log_file"
                                              rm "$log_file"
                                          fi
                                      fi
                                  done < /tmp/packwiz_jobs.txt
                                  
                                  # Clear the jobs file
                                  > /tmp/packwiz_jobs.txt
                                  
                                  echo ""
                                  echo "=== Rate limiting: waiting 20 seconds ==="
                                  sleep 20
                                  echo "=== Continuing with next batch ==="
                                  echo ""
                              fi
                          else
                              echo "Skipping $modpack $platform $loader $version (directory doesn't exist)"
                          fi
                          fi
                      done
                  done
              done
          done
          
          # Wait for any remaining background jobs and show their output
          echo ""
          echo "=== Processing final batch ==="
          while read -r job_info; do
              if [ -n "$job_info" ]; then
                  pid=$(echo "$job_info" | cut -d' ' -f1)
                  log_file=$(echo "$job_info" | cut -d' ' -f2)
                  
                  wait "$pid" 2>/dev/null || true
                  
                  if [ -f "$log_file" ]; then
                      echo ""
                      echo "Output from final job $pid:"
                      cat "$log_file"
                      rm "$log_file"
                  fi
              fi
          done < /tmp/packwiz_jobs.txt
          echo "All updates completed"
      
      - name: Commit Updates
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
